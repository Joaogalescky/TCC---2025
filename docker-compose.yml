services:
  backend:
    build:
      context: ./fast_backend
      dockerfile: Dockerfile
    container_name: eleicao_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///database.db}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      PLAINTEXT_MODULUS: ${PLAINTEXT_MODULUS:-65537}
      MULTIPLICATIVE_DEPTH: ${MULTIPLICATIVE_DEPTH:-2}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no arquivo .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - ./fast_backend/database.db:/app/database.db
    networks:
      - eleicao_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./svelte_frontend
      dockerfile: Dockerfile
    container_name: eleicao_frontend
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eleicao_network
    restart: unless-stopped

networks:
  eleicao_network:
    driver: bridge
